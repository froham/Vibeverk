name: Tester
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --save-dev jsdom
      # De to kjende, aksepterte testfeila (sjå CLAUDE.md/AGENTS.md) skal ikkje
      # gjere at CI feiler — men ein ny, uventa feil skal framleis stoppe bygget.
      - name: node test.js (toleranse for kjend feil)
        run: |
          set +e
          OUTPUT=$(node test.js 2>&1)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q '^Resultat:'; then
            echo "::error::test.js fullførte ikkje (ingen 'Resultat:'-oppsummering) — truleg ein uventa exception/krasj:"
            exit 1
          fi
          UNEXPECTED=$(echo "$OUTPUT" | grep '^FEIL:' | grep -v 'henvendelses-fanen heter «Kontakt»')
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Uventa testfeil i test.js (utover den kjende, dokumenterte feilen):"
            echo "$UNEXPECTED"
            exit 1
          fi
          exit 0
      - name: node test-workspace.js (toleranse for kjend feil)
        run: |
          set +e
          OUTPUT=$(node test-workspace.js 2>&1)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q ' tester — '; then
            echo "::error::test-workspace.js fullførte ikkje (ingen '… tester —'-oppsummering) — truleg ein uventa exception/krasj:"
            exit 1
          fi
          UNEXPECTED=$(echo "$OUTPUT" | grep '^FEIL:' | grep -v 'o3: workspaceship via direkterute')
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Uventa testfeil i test-workspace.js (utover den kjende, dokumenterte feilen):"
            echo "$UNEXPECTED"
            exit 1
          fi
          exit 0
