<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Statisk, IKKJE per-tenant -- Console er Vibeverk sitt eige interne
       operatørverktøy, aldri kunde-merkevarebygd, uansett kva hostname han
       vert nådd via. -->
  <link rel="manifest" href="manifest.json">
  <title>Console — Vibeverk</title>

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline'
                https://cdn.jsdelivr.net;
    connect-src 'self'
                https://cdn.jsdelivr.net
                https://*.supabase.co
                wss://*.supabase.co;
    style-src   'self' 'unsafe-inline'
                https://fonts.googleapis.com
                https://cdn.jsdelivr.net;
    font-src    'self'
                https://fonts.gstatic.com
                https://cdn.jsdelivr.net
                data:;
    img-src     'self' data: https:;
  ">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">

  <style>
    /* =========================================================================
       KONSOLL-GRUNNSTIL — nøytralt Vibeverk-internt tema.
       console-core.js overrider CSS-vars etter at core.js har sett kundefargane.
       ====================================================================== */
    :root {
      --color-primary:   #2563eb;
      --color-secondary: #7c3aed;
      --color-bg:        #f1f5f9;
      --color-surface:   #ffffff;
      --color-text:      #0f172a;
      --color-muted:     #64748b;
      --color-border:    rgba(15,23,42,.12);
      --color-alt:       rgba(37,99,235,.04);
      --color-tint:      rgba(37,99,235,.08);
      --font-display:    "Inter", system-ui, sans-serif;
      --font-body:       "Inter", system-ui, sans-serif;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.1; margin: 0; }
    a { color: var(--color-primary); text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* --- Knapper ---------------------------------------------------------- */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      font: inherit; font-weight: 600; cursor: pointer;
      padding: .72rem 1.3rem; border-radius: 999px; border: 1.5px solid transparent;
      transition: background .15s, box-shadow .15s, opacity .15s;
      line-height: 1;
    }
    .btn--primary  { background: var(--color-primary); color: #fff; }
    .btn--primary:hover { box-shadow: 0 6px 18px color-mix(in srgb, var(--color-primary) 35%, transparent); }
    .btn--ghost    { background: transparent; color: var(--color-text); border-color: var(--color-border); }
    .btn--ghost:hover { background: var(--color-tint); }
    /* Fanst ingen visuell disabled-tilstand for knappar noko stad i Console
       frå før (UX-review-funn 2026-08-04, oppdaga via "Last ned som bilde"
       som no vert disabled når null pakkar er valde i Forhåndsvisning) --
       retta éin gong her, gjeld alle knappar, ikkje berre denne. */
    .btn:disabled, .btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn:disabled:hover, .btn[disabled]:hover { box-shadow: none; }

    /* --- Formfelt --------------------------------------------------------- */
    .field { display: grid; gap: .35rem; }
    .field label { font-size: .85rem; font-weight: 600; color: var(--color-text); }
    .field__hint  { font-size: .78rem; color: var(--color-muted); margin: -.1rem 0 0; }
    /* Delt med field({help})/helpIcon() i components.js -- manglet heilt i
       Console frå før (2026-07-13, copy-clarity-initiativet fase 4): utan
       denne rendrar helpIcon()-knappen ustilt, og "pop"-teksten vises alltid
       i staden for berre ved klikk. Bindinga (bindHelpIcons()) kjem alt frå
       core.js sin delte, ubetinga bootstrap -- ingen eigen binding trengst her. */
    .help-icon { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--color-border); color: var(--color-muted); font-size: .72rem; font-weight: 700; border: none; cursor: pointer; vertical-align: middle; margin-left: .35rem; padding: 0; line-height: 1; }
    .help-icon__pop { display: none; position: absolute; bottom: 135%; left: 50%; transform: translateX(-50%); width: 230px; background: var(--color-text); color: #fff; font-size: .78rem; font-weight: 400; line-height: 1.45; padding: .65rem .75rem; border-radius: 8px; z-index: 20; text-align: left; }
    .help-icon.is-open .help-icon__pop { display: block; }
    .field input:not([type="color"]), .field textarea {
      font: inherit; padding: .7rem .85rem; border-radius: 10px;
      border: 1.5px solid var(--color-border); background: var(--color-surface);
      color: var(--color-text); width: 100%; resize: vertical;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:not([type="color"]):focus, .field textarea:focus {
      outline: none; border-color: var(--color-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 18%, transparent);
    }
    .field input:disabled { opacity: .55; cursor: not-allowed; }
    .field input[type="color"] {
      width: 100%; height: 42px; padding: 3px 4px;
      border-radius: 10px; border: 1.5px solid var(--color-border);
      background: var(--color-surface); cursor: pointer;
    }
    /* "Vis passord"-veksling */
    .pw-field { position: relative; }
    .field .pw-field input:not([type="color"]) { padding-right: 2.75rem; }
    .pw-toggle {
      position: absolute; top: 50%; right: .15rem; transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center;
      min-width: 40px; min-height: 40px; padding: 0; border: 0; background: none;
      color: var(--color-muted); font-size: 1.1rem; cursor: pointer; border-radius: 8px;
    }
    .pw-toggle:hover { color: var(--color-text); }
    .pw-toggle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
    /* Skjul nettlesaren sin eigen (native) passord-ikon, som elles dobbeltar seg opp med .pw-toggle */
    input::-ms-reveal, input::-ms-clear { display: none; }
    input::-webkit-credentials-auto-fill-button { visibility: hidden; }
    .form__status { margin: 0; font-size: .9rem; min-height: 1.2em; }
    .form__status.is-ok    { color: #16a34a; }
    .form__status.is-error { color: #c0392b; }

    /* Rik tekst-felt (personverntekst m.m.) — delt komponent frå core.js/components.js */
    .rtfield__toolbar { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; border: 1px solid var(--color-border); border-bottom: 0; border-radius: 8px 8px 0 0; padding: .35rem .4rem; background: var(--color-alt); }
    .rtfield__toolbar button { background: none; border: 1px solid transparent; border-radius: 6px; padding: .3rem .55rem; cursor: pointer; font-size: .85rem; color: var(--color-text); line-height: 1; }
    .rtfield__toolbar button:hover { background: var(--color-bg); border-color: var(--color-border); }
    .rtfield__sep { width: 1px; height: 1.2rem; background: var(--color-border); margin: 0 .15rem; }
    .rtfield__colorlabel { display: inline-flex; align-items: center; gap: .25rem; padding: .3rem .4rem; border-radius: 6px; cursor: pointer; position: relative; }
    .rtfield__colorlabel:hover { background: var(--color-bg); }
    .rtfield__colorlabel input[type="color"] { width: 18px; height: 18px; padding: 0; border: 0; cursor: pointer; }
    .rtfield__editor { min-height: 120px; border: 1px solid var(--color-border); border-radius: 0 0 8px 8px; padding: .7rem .8rem; background: var(--color-bg); font: inherit; line-height: 1.6; resize: vertical; overflow: auto; }
    .rtfield__editor:focus { outline: none; border-color: var(--color-primary); }
    .rtfield__editor ul, .rtfield__editor ol { padding-left: 1.4rem; margin: .4rem 0; }
    .rtfield__counter { margin: 0; text-align: right; }
    .rtfield__counter.is-over { color: #c0392b; font-weight: 600; }

    /* --- Admin-gruppar ---------------------------------------------------- */
    .admin-group {
      border: 1px solid var(--color-border); border-radius: 12px;
      padding: 1rem 1.2rem; display: grid; gap: .85rem;
    }
    .admin-group legend { font-weight: 700; padding: 0 .4rem; font-size: .95rem; }
    .cs-danger-zone { border-color: rgba(192,57,43,.3); }

    /* --- Nettsidehelse (renderNettsidehelseSection() sitt HTML-utdata, delt
       med Web-admin sin Design -> SEO-fane -- reglane er identiske med
       admin/index.html sine, sidan konsollen elles ikkje hadde desse
       klassane frå før (fyrste gong Console rendrar dette innhaldet)). ------ */
    .an-heading { margin: 0 0 .8rem; font-size: 1rem; }
    .an-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; margin-bottom: 1.6rem; }
    .an-card { border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1rem 1.1rem; background: var(--color-surface); }
    .an-card__val { font-size: 2rem; font-weight: 700; line-height: 1; color: var(--color-primary); }
    .an-card__label { font-size: .85rem; color: var(--color-muted); margin: .3rem 0 .4rem; }
    @media(max-width:560px) { .an-cards { grid-template-columns: 1fr; } }
    .prose { font-size: 1.06rem; max-width: 60ch; color: color-mix(in srgb, var(--color-text) 90%, transparent); }
    .prose--muted { color: var(--color-muted); }
    .lead-details { margin: .4rem 0; }
    .lead-details summary { cursor: pointer; font-size: .88rem; color: var(--color-muted); list-style: none; }
    .lead-details summary::-webkit-details-marker { display: none; }
    .lead-details summary::before { content: "▸ "; color: var(--color-primary); }
    .lead-details[open] summary::before { content: "▾ "; }
    .lead-details[open] summary { color: var(--color-text); font-weight: 600; }

    /* --- Kundar (Fase 9 onboarding-sjekkliste) ------------------------------ */
    /* Stilrefresh 2026-08-04: initial-ikon + status som pille + domene som
       undertekst, i staden for berre eit namn og laus farga statustekst --
       og ein "valgt"-tilstand som ikkje fanst i det heile før (einaste måten
       å sjå kven som var vald var å sjå etter sjekklista under lista). */
    .btn--sm { padding: .4rem .8rem; font-size: .85rem; }
    .kd-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
    .kd-row {
      display: flex; align-items: center; gap: .7rem; min-height: 44px;
      padding: .6rem .8rem; border: 1px solid var(--color-border); border-radius: 10px;
      background: var(--color-surface); cursor: pointer; transition: border-color .12s, background .12s, box-shadow .12s;
    }
    .kd-row:hover { border-color: var(--color-primary); box-shadow: 0 2px 10px rgba(37,99,235,.08); }
    .kd-row.is-active { border-color: var(--color-primary); background: var(--color-tint); }
    .kd-row:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
    .kd-row__avatar {
      width: 32px; height: 32px; border-radius: 9px; background: var(--color-tint); color: var(--color-primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .76rem; flex-shrink: 0;
    }
    .kd-row.is-active .kd-row__avatar { background: var(--color-primary); color: #fff; }
    .kd-row__avatar.is-archived { background: var(--color-border); color: var(--color-muted); }
    .kd-row__body { flex: 1; min-width: 0; }
    .kd-row__name { display: block; font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kd-row__meta { display: block; font-size: .76rem; color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kd-pill { font-size: .68rem; font-weight: 700; padding: .2rem .55rem; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
    .kd-pill--active { background: rgba(30,132,73,.12); color: #1e8449; }
    .kd-pill--provisioning { background: rgba(212,160,23,.14); color: #a5730f; }
    .kd-pill--suspended { background: rgba(192,57,43,.12); color: #c0392b; }
    .kd-pill--archived { background: var(--color-tint); color: var(--color-muted); }
    .kd-card {
      border: 1px solid var(--color-border); border-radius: 10px;
      padding: .85rem 1rem; display: grid; gap: .5rem;
    }

    /* --- Læring: markdown-visning av docs/onboarding/*.md ------------------ */
    .cs-md-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem; }
    .cs-md-tab {
      font: inherit; font-size: .85rem; padding: .5rem 1rem;
      border-radius: 999px; border: 1.5px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text); cursor: pointer;
    }
    .cs-md-tab.is-active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .cs-md-body {
      border: 1px solid var(--color-border); border-radius: 12px;
      padding: 1.5rem 1.8rem; background: var(--color-surface);
      max-width: 860px; line-height: 1.65;
    }
    .cs-md-body h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .cs-md-body h2 { font-size: 1.2rem; margin: 1.8rem 0 .7rem; }
    .cs-md-body h3 { font-size: 1.02rem; margin: 1.4rem 0 .5rem; }
    .cs-md-body p, .cs-md-body ul, .cs-md-body ol { margin: 0 0 .9rem; }
    .cs-md-body ul, .cs-md-body ol { padding-left: 1.4rem; }
    .cs-md-body blockquote {
      margin: 0 0 1rem; padding: .6rem 1rem; border-left: 3px solid var(--color-primary);
      background: var(--color-alt); color: var(--color-muted); font-size: .92rem;
    }
    .cs-md-body code { background: var(--color-alt); padding: .1rem .35rem; border-radius: 4px; font-size: .88em; }
    .cs-md-body pre { background: var(--color-alt); padding: .8rem 1rem; border-radius: 8px; overflow-x: auto; }
    .cs-md-body pre code { background: none; padding: 0; }
    .cs-md-body table { border-collapse: collapse; width: 100%; margin: 0 0 1.2rem; font-size: .88rem; }
    .cs-md-body th, .cs-md-body td { border: 1px solid var(--color-border); padding: .5rem .7rem; text-align: left; vertical-align: top; }
    .cs-md-body th { background: var(--color-alt); font-weight: 700; }
    .cs-md-body a { color: var(--color-primary); }
    .cs-md-body hr { border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0; }

    /* Fontpar-knappar */
    .fontpair-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .9rem; }
    .fontpair-btn {
      font: inherit; font-size: .82rem; padding: .4rem .8rem;
      border-radius: 999px; border: 1.5px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text); cursor: pointer;
    }
    .fontpair-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .fontpair-btn.is-active { border-color: var(--color-primary); background: var(--color-tint); color: var(--color-primary); font-weight: 700; }

    /* To-kolonne-grid for felt */
    .bk-2col { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }

    /* Avkryssingsgrid for feature-flaggar */
    .cs-checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem; }
    .cs-checkbox-label {
      display: flex; align-items: center; gap: .45rem;
      font-size: .9rem; cursor: pointer; padding: .4rem .5rem;
      border-radius: 8px; transition: background .1s;
    }
    .cs-checkbox-label:hover { background: var(--color-tint); }

    /* Radio-labels for produktpakke */
    .cs-radio-label {
      display: flex; align-items: flex-start; gap: .6rem;
      font-size: .92rem; cursor: pointer; padding: .5rem .4rem;
      border-radius: 8px; transition: background .1s;
    }
    .cs-radio-label:hover { background: var(--color-tint); }
    .cs-radio-label input { margin-top: .2rem; flex-shrink: 0; }

    /* =========================================================================
       KONSOLL-LAYOUT
       ====================================================================== */
    #console-app { min-height: 100vh; }

    /* ---- Innlogging ---- */
    .cs-login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--color-bg); padding: 2rem;
    }
    .cs-login-box {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius); padding: 2.4rem 2rem;
      width: 100%; max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,.07);
    }
    .cs-login-brand {
      font-size: 1.3rem; font-weight: 700; margin: 0 0 .25rem;
      display: flex; align-items: center; gap: .45rem; color: var(--color-primary);
    }
    .cs-login-sub { margin: 0 0 1.5rem; font-size: .88rem; color: var(--color-muted); }

    /* ---- Hovudskall ---- */
    .cs-wrap { display: flex; height: 100vh; overflow: hidden; }

    .cs-wrap { --cs-sidebar-w: 224px; }
    .cs-sidebar {
      position: relative;
      width: var(--cs-sidebar-w); flex-shrink: 0;
      background: #1e293b; color: #e2e8f0;
      display: flex; flex-direction: column;
      overflow-y: auto;
      transition: width .15s ease;
    }
    /* Minimert sidemeny -- same mønster som Workspace sin
       .i-sidebar.is-collapsed (workspace/index.html), berre ikon synleg.
       Persistert i localStorage ("cs-sidebar-collapsed"), sjå buildShell(). */
    .cs-sidebar__collapse-btn {
      position: absolute; top: .5rem; right: .5rem; z-index: 2;
      width: 24px; height: 24px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
      background: rgba(255,255,255,.04); color: #94a3b8;
      cursor: pointer; font-size: .8rem; padding: 0;
    }
    .cs-sidebar__collapse-btn:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
    .cs-sidebar.is-collapsed { --cs-sidebar-w: 64px; }
    .cs-sidebar.is-collapsed .cs-brand__label,
    .cs-sidebar.is-collapsed .cs-tenant-picker,
    .cs-sidebar.is-collapsed .cs-nav__item-label,
    .cs-sidebar.is-collapsed .cs-sidebar__foot { display: none; }
    /* Kollapseknappen er absolutt-posisjonert oppe til høgre (24px, top:.5rem)
       -- i det smale 64px-kollapsa sidefeltet delte han rad med det sentrerte
       merke-ikonet og overlappa det (rapportert bug, 2026-08-04). Nok
       topp-padding her flyttar ikonet klart under knappen i staden. */
    .cs-sidebar.is-collapsed .cs-brand { justify-content: center; padding: 2.6rem .5rem 1rem; }
    .cs-sidebar.is-collapsed .cs-nav__item { justify-content: center; padding: .6rem; }
    .cs-brand {
      padding: 1.3rem 1.2rem 1rem;
      font-weight: 700; font-size: 1.05rem;
      display: flex; align-items: center; gap: .5rem;
      color: #f1f5f9;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .cs-brand .ti { color: #60a5fa; font-size: 1.25rem; }
    .cs-customer {
      padding: .55rem 1.2rem .7rem;
      font-size: .77rem; color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .cs-tenant-picker {
      padding: .55rem 1.2rem .7rem;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .cs-tenant-picker select {
      width: 100%; background: rgba(255,255,255,.06); color: #e2e8f0;
      border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
      padding: .35rem .5rem; font: inherit; font-size: .82rem; cursor: pointer;
    }
    /* Nedtrekkslista (<option>) rendrast av OS-et, ikkje av denne CSS-en sin
       mørke bakgrunn — utan eksplisitt farge her arvar Chrome/Windows lys
       systemtekst på lys systembakgrunn, nesten usynleg. */
    .cs-tenant-picker select option {
      color: #1e293b; background: #ffffff;
    }
    .cs-nav { flex: 1; display: flex; flex-direction: column; padding: .6rem 0; }
    .cs-nav__item {
      display: flex; align-items: center; gap: .6rem;
      padding: .6rem 1.2rem;
      background: none; border: none; border-left: 3px solid transparent;
      color: #94a3b8; font: inherit; font-size: .9rem;
      cursor: pointer; text-align: left;
      transition: background .12s, color .12s;
    }
    .cs-nav__item:hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
    .cs-nav__item.is-active { background: rgba(96,165,250,.1); color: #60a5fa; border-left-color: #2563eb; }
    .cs-nav__item .ti { font-size: 1.1rem; }

    .cs-sidebar__foot {
      padding: .8rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,.07);
    }
    .cs-logout-btn {
      display: flex; align-items: center; gap: .5rem;
      background: none; border: 1px solid rgba(255,255,255,.15);
      color: #94a3b8; font: inherit; font-size: .85rem;
      padding: .5rem .9rem; border-radius: 8px; cursor: pointer; width: 100%;
    }
    .cs-logout-btn:hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
    .cs-version {
      margin-top: .6rem; text-align: center;
      font-size: .72rem; color: #64748b;
    }

    .cs-main { flex: 1; overflow-y: auto; background: var(--color-bg); display: flex; flex-direction: column; }
    .cs-content { max-width: 720px; width: 100%; padding: 2rem 2rem 4rem; margin: 0 auto; }
    /* Berre Priser-fana treng meir enn lesebreidde -- edit-layout/compare-grid
       sine fleire-kolonner-rutenett vart klemt til éin-og-ein-halv kolonne
       innanfor 720px (brukarfunn 2026-08-04). Dei andre fanene (Produkt,
       Personvern osb.) er enkle tekst-/skjemasider som framleis les betre
       smalt -- difor eit eige, section-spesifikt modifikatortillegg i
       staden for å utvide .cs-content globalt. Sett/fjerna i renderSection(). */
    .cs-content.cs-content--wide { max-width: 1400px; }

    .cs-page-head { margin-bottom: 1.6rem; padding-bottom: 1rem; border-bottom: 1px solid var(--color-border); }
    .cs-page-title { font-size: 1.45rem; font-weight: 700; }

    /* --- Mobil (port av Workspace sitt hamburger/overlay-mønster, sjå
       workspace/index.html ".i-hamburger"/".i-sidebar-overlay") ------------ */
    .cs-mobile-bar {
      display: none;
      position: sticky; top: 0; z-index: 30; flex-shrink: 0;
      align-items: center; gap: .8rem;
      height: 52px; padding: 0 1.1rem;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    .cs-hamburger {
      display: none;
      background: none; border: 0; cursor: pointer;
      font-size: 1.3rem; color: var(--color-text); line-height: 1;
      min-width: 40px; min-height: 40px;
      align-items: center; justify-content: center;
    }
    .cs-mobile-bar__brand { font-weight: 700; font-size: .95rem; color: var(--color-text); }
    .cs-sidebar-overlay {
      display: none;
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
    }
    @media (max-width: 700px) {
      .cs-sidebar__collapse-btn { display: none; }
      .cs-hamburger { display: flex; align-items: center; }
      .cs-mobile-bar { display: flex; }
      .cs-sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        z-index: 50; transform: translateX(-100%);
        transition: transform .22s ease;
        box-shadow: 4px 0 24px rgba(0,0,0,.35);
      }
      .cs-sidebar.is-open { transform: translateX(0); }
      .cs-sidebar-overlay.is-open { display: block; }
      .cs-content { padding: 1.2rem 1rem 3rem; }
      /* Ein "minimert"-preferanse sett på skrivebord (localStorage
         "cs-sidebar-collapsed") skal ALDRI gjelde i mobil-hamburgermenyen --
         her ER menyen alt eit eige slide-out-panel, og eit ikon-berre
         64px-panel ville gjort tenant-veljar/navn/logg-ut utilgjengeleg
         (UX-review-funn 2026-08-04). Overstyrer --cs-sidebar-w og alle
         .is-collapsed-reglane over tilbake til full breidde/synlegheit. */
      .cs-sidebar.is-collapsed { --cs-sidebar-w: 224px; }
      .cs-sidebar.is-collapsed .cs-brand__label,
      .cs-sidebar.is-collapsed .cs-tenant-picker,
      .cs-sidebar.is-collapsed .cs-nav__item-label,
      .cs-sidebar.is-collapsed .cs-sidebar__foot { display: revert; }
      .cs-sidebar.is-collapsed .cs-brand { justify-content: flex-start; padding: 1.3rem 1.2rem 1rem; }
      .cs-sidebar.is-collapsed .cs-nav__item { justify-content: flex-start; padding: .6rem 1rem; }
    }

    /* Priser-fana (console-core.js sin renderPriser() m.fl.) -- delt CSS
       for pakkeredigering, modulprisliste, à la carte-tilbudsbygger og
       forhåndsvisning. Bruker dei same --color-*/--radius-variablane som
       resten av Console, ikkje eigne fargar. */
    .seg { display:flex; border:1px solid var(--color-border); border-radius:999px; overflow:hidden; flex-wrap:wrap; }
    .seg button { background:var(--color-surface); border:0; padding:.5rem 1rem; min-height:44px; font: inherit; font-size:.85rem; font-weight:600; color:var(--color-muted); cursor:pointer; }
    .seg button + button { border-left:1px solid var(--color-border); }
    .seg button.is-active { background: var(--color-primary); color:#fff; }

    /* Rediger pakker -- master/detail (brukarønske 2026-08-04: å ha alle
       pakkane opne side om side heile tida vart "rotete og uoversiktleg" --
       vel éi pakke i lista til venstre, rediger berre den til høgre). */
    .edit-layout { display: grid; grid-template-columns: 260px 1fr; gap: 1.2rem; align-items: start; }
    .pkg-rail { border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); overflow: hidden; position: sticky; top: 1rem; }
    .pkg-rail__head { padding: .9rem 1rem .6rem; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--color-muted); }
    /* .pkg-row-wrap: pil opp/ned (brukarønske 2026-08-05) sit no attmed sjølve
       vel-knappen, i staden for inni han -- ein <button> kan ikkje inneholde
       ein annan <button>. Rekkjefølgja her er akkurat rekkjefølgja i
       _priserData.packages, som «Forhåndsvisning» rendrar i uendra --
       flytt ei pakke her, og ho flytter seg med i forhåndsvisinga. */
    .pkg-row-wrap { display: flex; align-items: stretch; }
    .pkg-row {
      display: flex; align-items: center; gap: .65rem; flex: 1; min-width: 0; text-align: left;
      padding: .7rem 1rem; border: none; background: none; cursor: pointer; font: inherit;
      border-left: 3px solid transparent; color: var(--color-text); min-height: 44px;
    }
    .pkg-row:hover { background: var(--color-tint); }
    .pkg-row.is-active { background: var(--color-tint); border-left-color: var(--color-primary); }
    .pkg-row:focus-visible, .pkg-rail__add:focus-visible, .edit-panel__del:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
    .pkg-row__reorder { display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; border-left: 1px solid var(--color-border); }
    .pkg-row__move {
      width: 34px; height: 22px; display: flex; align-items: center; justify-content: center;
      border: none; background: none; color: var(--color-muted); cursor: pointer; padding: 0; font-size: .9rem;
    }
    .pkg-row__move:hover:not(:disabled) { background: var(--color-tint); color: var(--color-primary); }
    .pkg-row__move:disabled { opacity: .3; cursor: not-allowed; }
    .pkg-row__move:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
    .pkg-row__dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--color-border); }
    .pkg-row__body { flex: 1; min-width: 0; }
    .pkg-row__name { display: block; font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pkg-row__price { display: block; font-size: .76rem; color: var(--color-muted); }
    .pkg-rail__add {
      display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left; min-height: 44px;
      padding: .75rem 1rem; border: none; border-top: 1px solid var(--color-border); background: none;
      color: var(--color-muted); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    }
    .pkg-rail__add:hover { color: var(--color-primary); background: var(--color-tint); }
    .pkg-rail__add .plus { width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed var(--color-muted); display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }

    .edit-panel { border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); }
    .edit-panel__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--color-border); }
    .edit-panel__title { font-size: 1.15rem; font-weight: 700; }
    .edit-panel__sub { font-size: .8rem; color: var(--color-muted); margin-top: .15rem; }
    .edit-panel__del { background: none; border: 1px solid var(--color-border); color: var(--color-muted); font-size: .8rem; padding: .45rem .8rem; border-radius: 8px; cursor: pointer; white-space: nowrap; min-height: 44px; }
    .edit-panel__del:hover { border-color: #c0392b; color: #c0392b; background: rgba(192,57,43,.06); }
    .edit-panel__body { padding: 1.3rem 1.4rem 1.5rem; }
    /* Kvar konseptuelle gruppe (Grunnleggande/Innstillingar/Grenser/
       moduler) får ei tydeleg skiljelinje, ikkje berre ein uppercase-
       mikrolabel (UX-review-funn 2026-08-04 -- éin lang, udelt kolonne
       kjentest "rotete/uoversiktleg"). */
    .rp-section { padding-top: 1.2rem; margin-top: 1.2rem; border-top: 1px solid var(--color-border); }
    .rp-section:first-child { padding-top: 0; margin-top: 0; border-top: none; }
    /* 1.6rem, ikkje .9rem -- brukarønske 2026-08-04: "lag litt luft mellom
       'fremhev...' og 'Standardmoduler'" (dei to togglane i Innstillinger
       kjentest for tett saman). */
    .rp-section > .highlight-fieldset { margin-bottom: 1.6rem; }
    /* 900px, ikkje 700px -- UX-review-funn 2026-08-04: ved 768px med
       skrivebord-sidemenyen framleis open (ho minimerer/skjuler seg fyrst
       ved 700px) var det att for lite plass til både 260px-lista OG eit
       lesbart redigeringspanel side om side. */
    @media (max-width: 900px) { .edit-layout { grid-template-columns: 1fr; } .pkg-rail { position: static; } }

    /* Pris/Oppstartskostnad som reine "stat"-kort (brukarønske 2026-08-04:
       "Ikke noe mer på de to rutene" enn talet sjølv -- ingen eining-tekst
       attmed, ingen hint-linje under; det tidlegare "Veiledende sum"-hintet
       ligg no i helpIcon() ved sida av kvar label i staden). Farga tal --
       same "stat"-mønster som .an-card__val i Analyse-fana -- er den einaste
       fargebruken lagt til her, valt for å ikkje finne opp ny visuell
       språkbruk (brukarønske: "bruke litt farger for å skape dynamikk"). */
    /* margin-top lagt til (brukarfunn 2026-08-04): .field (Pakkenavn) har
       ingen eigen margin-bottom, og .stat-row hadde berre margin-bottom, ikkje
       margin-top -- dei to sat difor heilt utan luft mellom seg, medan
       stat-row -> neste .field (Kort beskrivelse) hadde normal avstand. */
    .stat-row { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1rem; margin-bottom: 1rem; }
    /* --color-bg var identisk med SIDA sin eigen bakgrunn (.cs-main), så
       "ramma" forsvann heilt -- synte seg berre som ein tynn kant på grått
       mot grått (brukarfunn 2026-08-04, "det må stå 'ut' fra bakgrunnen").
       --color-tint (eit lyst blått slør, skil seg frå BÅDE kvit panel-
       bakgrunn og grå sidebakgrunn) + ein synleg blå kant i staden --
       konsekvent på alle kortlikeelement i modulen, ikkje berre desse to. */
    .stat-box { flex: 1 1 200px; border: 1.5px solid color-mix(in srgb, var(--color-primary) 30%, transparent); background: var(--color-tint); border-radius: 10px; padding: .8rem 1rem; }
    .stat-box label { font-size: .78rem; font-weight: 600; color: var(--color-text); display: block; margin-bottom: .3rem; }
    .stat-input-row { display: flex; align-items: baseline; gap: .3rem; }
    /* Sort (--color-text), ikkje --color-primary -- brukarønske 2026-08-04:
       "trenger ikke å være den kvasse blåfargen på pris-skriftene". Sjølve
       ramma (kant/bakgrunn over) er framleis blå -- berre TALET er sort. */
    .stat-input-row input { font: inherit; font-size: 1.4rem; font-weight: 700; color: var(--color-text); border: none; background: none; padding: 0; width: 6rem; }
    .stat-input-row input:focus { outline: none; }
    .stat-input-row input:disabled { color: var(--color-muted); }
    .stat-input-row .unit { font-size: .8rem; color: var(--color-muted); }
    /* "Hent priser" -- brukarønske 2026-08-05: liten knapp som hentar den
       kalkulerte modulsummen (alt vist som ein "veiledande sum"-helpIcon på
       label-en) rett inn i talfeltet, i staden for at operatøren må lese av
       hint-teksten og taste inn tallet manuelt. */
    .stat-input-row .stat-fetch-btn { margin-left: auto; align-self: center; }
    .stat-onrequest { font-size: 1.05rem; font-weight: 700; color: var(--color-text); }

    /* Grenser -- kvar grense fekk INGEN ramme frå før, medan rada strekte
       kvart kort ut over ei heil 1fr-brei rutenett-kolonne (eit lite tal
       flytande i eit stort tomt rom -- brukarfunn 2026-08-04, "ser ikke
       ryddig eller fint ut"). Same "stat-kort"-mønster som Pris/
       Oppstartskostnad over, flex med fast basisbreidde i staden for eit
       rutenett som tvinga korta til å fylle heile radbreidda. */
    .cap-row { display: flex; flex-wrap: wrap; gap: .8rem; }
    .cap-card { flex: 0 1 180px; border: 1.5px solid color-mix(in srgb, var(--color-primary) 30%, transparent); background: var(--color-tint); border-radius: 10px; padding: .8rem .9rem; }
    .cap-card .cap-label { font-size: .78rem; font-weight: 600; color: var(--color-text); display: block; margin-bottom: .3rem; }
    .cap-card .stat-input-row { margin-bottom: .5rem; }
    .cap-card .stat-input-row input { font-size: 1.2rem; width: 4rem; }
    .cap-card .cap-unlimited { display: flex; align-items: center; gap: .35rem; font-size: .74rem; color: var(--color-muted); cursor: pointer; padding-top: .5rem; border-top: 1px solid color-mix(in srgb, var(--color-primary) 20%, transparent); }
    .cap-card .cap-unlimited input { margin: 0; }

    .feat-section-title { font-size: .76rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color: var(--color-muted); margin: .3rem 0 .5rem; }
    .feat-subgroup-title { font-size: .72rem; font-weight:600; color: var(--color-muted); margin: .5rem 0 .3rem; padding-left: .1rem; }
    .feat-subgroup-title:first-child { margin-top: 0; }
    .all-standard-line { font-size: .85rem; color: var(--color-text); background: var(--color-tint); border-radius: 8px; padding: .5rem .7rem; margin: 0 0 .3rem; font-weight:600; }
    .feat-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: .35rem; }
    .feat-chip { display:flex; align-items:center; gap:.35rem; padding:.35rem .5rem; border-radius:8px; font-size:.82rem; flex-wrap: wrap; border: 1px solid transparent; }
    .feat-chip:hover { background: var(--color-tint); }
    /* Klassen fanst alt (priserFeatChip() i console-core.js), men hadde
       ingen matchande regel -- valde modular såg identiske ut som ikkje
       valde, bortsett frå sjølve avkryssingsboksen (UX-review-funn
       2026-08-04). Same "valgt"-mønster som .quote-chip.is-added like under. */
    .feat-chip.is-checked { background: var(--color-tint); border-color: color-mix(in srgb, var(--color-primary) 25%, transparent); font-weight: 600; }
    .feat-chip__label { display:flex; align-items:center; gap:.4rem; cursor:pointer; flex:1 1 auto; min-width:0; }
    .feat-chip__label input { margin:0; flex-shrink:0; }
    .feat-chip__tag {
      width: 6rem; font: inherit; font-size:.72rem; padding:.2rem .45rem; border-radius:6px;
      border:1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
    }
    .feat-chip__tag:focus { outline:none; border-color: var(--color-secondary); }
    .feat-chip__tag::placeholder { color: var(--color-muted); }
    .addon-tag { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color: var(--color-secondary); background: color-mix(in srgb, var(--color-secondary) 15%, transparent); padding:.05rem .35rem; border-radius:999px; }

    /* Same fargebehandling som .stat-box/.cap-card -- "hele modulen"
       (brukarønske 2026-08-04), ikkje berre dei to boksane som vart
       kritisert direkte. Dashed-kanten (utan farge) erstatta med same
       synlege blå kant + tint-bakgrunn. */
    .highlight-fieldset { border: 1.5px solid color-mix(in srgb, var(--color-primary) 30%, transparent); background: var(--color-tint); border-radius:10px; padding:.7rem .9rem; display:grid; gap:.5rem; }
    .highlight-fieldset__toggle { display:flex; align-items:center; gap:.5rem; font-size:.85rem; font-weight:600; }
    .highlight-fieldset__row { display:flex; gap:.6rem; align-items:flex-end; }
    .highlight-fieldset__row .field { flex:1; }
    .highlight-fieldset__row input[type="color"] { width:2.6rem; height:2.3rem; padding:2px; border-radius:8px; border:1.5px solid var(--color-border); background:var(--color-bg); cursor:pointer; }

    .preview-note { font-size:.8rem; color: var(--color-muted); margin-bottom:1.2rem; }

    /* Modulpriser */
    /* overflow-x:auto (ikkje hidden) -- UX-review-funn 2026-08-04: tabellen
       er breiare enn tilgjengeleg innhaldsbreidde på telefonskjermar (sidebar
       går av lerretet under 700px, att ~343px, tabellen treng ~324px+), og
       "hidden" klipte oppstartskostnad-kolonna heilt vekk og utilgjengeleg
       i staden for å la brukaren skrolle til henne. Same mønster som
       .cs-md-body pre alt bruker i denne fila. */
    .price-table-wrap { border:1px solid var(--color-border); border-radius: var(--radius); overflow-x:auto; background: var(--color-surface); margin-bottom: 1rem; }
    .price-table { width:100%; border-collapse: collapse; font-size:.88rem; }
    .price-table th { text-align:left; padding:.6rem .9rem; background: var(--color-alt); font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; color: var(--color-muted); font-weight:700; }
    .price-table td { padding:.5rem .9rem; border-top:1px solid var(--color-border); vertical-align:middle; }
    .price-table tr.group-row td { background: var(--color-alt); font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color: var(--color-muted); padding:.45rem .9rem; }
    .price-table input { font: inherit; font-size:.88rem; width:7rem; padding:.35rem .5rem; border-radius:6px; border:1.5px solid var(--color-border); background: var(--color-bg); color: var(--color-text); text-align:right; }
    .price-table input:focus { outline:none; border-color: var(--color-primary); }

    /* Bygg tilbud (à la carte) */
    .quote-layout { display:grid; grid-template-columns: 1.3fr 1fr; gap: 1.2rem; align-items:start; }
    @media (max-width:800px) { .quote-layout { grid-template-columns: 1fr; } }
    .quote-picker .feat-section-title { margin-top:1rem; }
    .quote-chip { display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.5rem .7rem; border:1px solid var(--color-border); border-radius:8px; margin-bottom:.35rem; font-size:.85rem; }
    .quote-chip.is-added { background: var(--color-tint); border-color: var(--color-primary); }
    .quote-chip__meta { color: var(--color-muted); font-size:.78rem; }
    .quote-chip button { font: inherit; font-size:.78rem; font-weight:700; border:0; background:none; cursor:pointer; padding:.6rem .55rem; min-height:44px; border-radius:999px; }
    .quote-chip__add { color: var(--color-primary); }
    .quote-chip__add:hover { background: var(--color-tint); }
    .quote-chip__rm { color: #c0392b; }
    .quote-chip__rm:hover { background: rgba(192,57,43,.1); }
    .quote-cart { border:1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); padding:1.1rem 1.2rem; }
    .quote-cart h4 { font-size:.95rem; margin-bottom:.7rem; }
    .quote-cart__empty { font-size:.85rem; color: var(--color-muted); }
    .quote-cart ul { list-style:none; margin:0 0 .8rem; padding:0; }
    .quote-cart li { display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.4rem 0; border-bottom:1px solid var(--color-border); font-size:.85rem; }
    .quote-cart li:last-child { border-bottom:none; }
    .quote-cart__totals { border-top: 1.5px solid var(--color-border); padding-top:.7rem; margin-top:.3rem; }
    .quote-cart__row { display:flex; justify-content:space-between; font-size:.88rem; padding:.2rem 0; }
    .quote-cart__row.is-total { font-weight:700; font-size:1rem; padding-top:.4rem; }
    .quote-extra { margin-top:.8rem; padding-top:.8rem; border-top: 1px dashed var(--color-border); }
    .quote-extra label { font-size:.78rem; font-weight:600; color: var(--color-muted); display:block; margin-bottom:.3rem; }
    .quote-extra input { font: inherit; width:100%; padding:.5rem .6rem; border-radius:8px; border:1.5px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }

    /* Forhåndsvisning */
    /* Hvilke pakker som vises kan variere frå kunde til kunde (brukarønske
       2026-08-04) -- avkryssingsbrikker over sjølve rutenettet. */
    .pv-select { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.5rem; }
    .pv-chip {
      display:flex; align-items:center; gap:.5rem; padding:.5rem .9rem; border-radius:999px; min-height:44px;
      border:1.5px solid var(--color-border); background: var(--color-surface); font: inherit; font-size:.85rem; font-weight:600;
      cursor:pointer; color: var(--color-muted); transition: border-color .12s, color .12s, background .12s;
    }
    .pv-chip .box { width:15px; height:15px; border-radius:4px; border:1.5px solid var(--color-muted); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.68rem; color:#fff; }
    .pv-chip.is-on { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-tint); }
    .pv-chip.is-on .box { border-color: var(--color-primary); background: var(--color-primary); }
    .pv-chip:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
    .pv-empty { text-align:center; padding:3rem 1rem; color: var(--color-muted); font-size:.9rem; border:1.5px dashed var(--color-border); border-radius: var(--radius); }
    .compare-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:1rem; }
    .compare-card { border:1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); padding:1.4rem 1.3rem; text-align:center; position:relative; }
    .compare-card.is-featured { box-shadow: 0 8px 24px rgba(0,0,0,.1); }
    .compare-card__badge { position:absolute; top:-.6rem; left:50%; transform:translateX(-50%); color:#fff; font-size:.68rem; font-weight:700; padding:.2rem .7rem; border-radius:999px; }
    .compare-card__name { font-size:1.1rem; margin-bottom:.4rem; }
    .compare-card__price { font-size:1.9rem; font-weight:700; margin-bottom:.2rem; }
    .compare-card__unit { font-size:.78rem; color: var(--color-muted); margin-bottom:.8rem; }
    .compare-card__desc { font-size:.85rem; color: var(--color-muted); margin-bottom:1rem; min-height:2.4em; }
    .compare-card__caps { display:flex; flex-wrap:wrap; justify-content:center; gap:.3rem; margin-bottom:1rem; }
    .compare-card__caps span { font-size:.68rem; font-weight:600; color: var(--color-text); background: var(--color-tint); border-radius:999px; padding:.2rem .55rem; }
    .compare-card ul { list-style:none; margin:0; padding:0; text-align:left; font-size:.85rem; }
    .compare-card li { display:flex; gap:.5rem; padding:.35rem 0; border-bottom:1px solid var(--color-border); }
    .compare-card li:last-child { border-bottom:none; }
