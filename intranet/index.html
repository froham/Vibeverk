<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flyttet til /workspace/ …</title>
  <!-- Denne fila er ein bevisst att-lete omdirigerings-snubbe etter at
       Workspace vart omdøypt frå /intranet/ til /workspace/ 2026-07-07
       (sjå docs/project/CHANGELOG.md og docs/decisions/ADR-0007). GitHub
       Pages har ingen server-side redirect-mekanisme (ingen _redirects-
       støtte, det er Netlify-only) — dette er den einaste no-infrastruktur
       løysinga. Bevarer djuplenker (t.d. #/dashboard) via location.hash. -->
  <script>
    location.replace("/workspace/" + location.hash);
  </script>
</head>
<body>
  <noscript>
    <p>Denne sida har flytta. <a href="/workspace/">Gå til /workspace/</a></p>
  </noscript>
</body>
</html>
